# Application Configuration
# Environment: Production

app:
  name: nebula-api-gateway
  version: 2.4.1
  environment: production
  debug: false
  log_level: info

server:
  host: 0.0.0.0
  port: 8443
  workers: 4
  timeout: 30
  ssl:
    enabled: true
    cert_path: /etc/ssl/certs/server.crt
    key_path: /etc/ssl/private/server.key
    min_version: TLSv1.2

database:
  primary:
    host: db-primary.internal
    port: 5432
    name: nebula_prod
    pool_size: 20
    max_overflow: 10
    ssl_mode: verify-full
  replica:
    host: db-replica.internal
    port: 5432
    name: nebula_prod
    pool_size: 10

cache:
  backend: redis
  host: redis-cluster.internal
  port: 6379
  db: 0
  ttl: 3600
  max_connections: 50

auth:
  provider: oauth2
  issuer: https://auth.example.com
  audience: nebula-api
  token_expiry: 3600
  refresh_expiry: 86400

rate_limiting:
  enabled: true
  requests_per_minute: 1000
  burst_size: 50

monitoring:
  metrics:
    enabled: true
    endpoint: /metrics
    port: 9090
  tracing:
    enabled: true
    provider: jaeger
    sample_rate: 0.1
  health_check:
    endpoint: /health
    interval: 10s
